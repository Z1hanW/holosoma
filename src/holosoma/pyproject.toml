[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holosoma"
version = "0.0.1"
requires-python = ">=3.8"
dependencies = [
    "astor",
    "easydict",
    "hydra-core>=1.2.0",
    "ipdb",
    "joblib",
    "loguru",
    "lxml",
    "lxml-stubs",
    "matplotlib",
    "meshcat",
    "mypy==1.14.1",
    "notebook",
    "numpy-stl",
    "numpy==1.23.5",
    "onnx",
    "onnxruntime",
    "open3d",
    "opencv-python",
    "plotly",
    "pydantic",
    "pygame",
    "pynput",
    "pytest",
    "rich",
    "scipy",
    "shapely",
    "tensorboard",
    "tensordict",
    "termcolor",
    "tqdm",
    "trimesh",
    "types-pynput",
    "types-python-dateutil",
    "types-requests",
    "types-tqdm",
    "tyro>=0.10.0a4",
    "wandb==0.22.0", # pin version until https://github.com/wandb/wandb/issues/10647 is fixed
    "warp-lang==1.10.0",
    "yourdfpy>=0.0.58",
    "zmq",
]

# Mark optional-dependencies as dynamic since it needs runtime computation
dynamic = ["optional-dependencies"]

[tool.setuptools.packages.find]
where = ["."]
