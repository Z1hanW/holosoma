# @package _global_

defaults:
  - task_base

task:
  type: "locomotion"
  name: "loco"
  description: "Locomotion simulation environment"

  # Interface
  DOMAIN_ID: 0
  INTERFACE: "lo"

  # Joystick
  USE_JOYSTICK: false
  JOYSTICK_TYPE: "xbox"
  JOYSTICK_DEVICE: 0
  
  sim_env:
    _target_: holosoma_inference.sim.base.BaseSimulator
    config:
      ROBOT_SCENE: ${robot.ROBOT_SCENE_XML}

  policy:
    _target_: holosoma_inference.policies.locomotion.LocomotionPolicy
    config:
      ROBOT_CFG: ${robot}
      OBS_CFG: ${obs}
      # Task-specific settings
      USE_PHASE: true
      GAIT_PERIOD: 1.0
      DESIRED_BASE_HEIGHT: 0.75
      residual_upper_body_action: false
    policy_action_scale: 0.25
