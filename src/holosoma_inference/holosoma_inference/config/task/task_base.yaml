# @package _global_

task:
  type: ???
  name: ???
  description: ???

  # Interface
  DOMAIN_ID: 0
  INTERFACE: "lo"
  NET: "127.0.0.1"

  # Joystick
  USE_JOYSTICK: false
  JOYSTICK_TYPE: "xbox"
  JOYSTICK_DEVICE: 0

  sim_env:
    _target_: ???
    config:
      ROBOT_CFG: ${robot}
      OBS_CFG: null  # Will be set by specific task configs if needed
      ROBOT_SCENE: ???
      # Interface (inherited from task)
      DOMAIN_ID: ${task.DOMAIN_ID}
      INTERFACE: ${task.INTERFACE}

      # Joystick (inherited from task)
      USE_JOYSTICK: ${task.USE_JOYSTICK}
      JOYSTICK_TYPE: ${task.JOYSTICK_TYPE}
      JOYSTICK_DEVICE: ${task.JOYSTICK_DEVICE}

      # Simulation
      SIMULATE_DT: 0.001
      VIEWER_DT: 0.02
      USE_ROS: false

      # visualization
      VISUALIZE_FORCES: false
      VISUALIZE_PIN: false

      # Elastic Band
      ENABLE_ELASTIC_BAND: true
      BAND_ATTACHED_LINK: ${robot.torso_link_name}

      # Print Scene Information
      PRINT_SCENE_INFORMATION: false 
  
  policy:
    _target_: ???
    config:
      # Interface (inherited from task)
      DOMAIN_ID: ${task.DOMAIN_ID}
      INTERFACE: ${task.INTERFACE}
      NET: ${task.NET}
      # Joystick and ROS (inherited from task)
      USE_JOYSTICK: ${task.USE_JOYSTICK}
      JOYSTICK_TYPE: ${task.JOYSTICK_TYPE}
      JOYSTICK_DEVICE: ${task.JOYSTICK_DEVICE}
      USE_ROS: ${task.sim_env.config.USE_ROS}
    model_path: ${model_path}
    policy_action_scale: ???